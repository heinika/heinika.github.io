<!doctype html>
<html lang="zh-CN" data-theme="night">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050810">
  <meta name="color-scheme" content="dark light">
  <meta name="robots" content="noindex">
  <meta name="description" content="页面没有找到，回到陈·未完稿个人作品集。">
  <title>页面走丢了｜陈·未完稿</title>
  <script>
    try {
      const savedTheme = localStorage.getItem("portfolio-theme");
      const prefersPaper = matchMedia("(prefers-color-scheme: light)").matches;
      document.documentElement.dataset.theme = savedTheme || (prefersPaper ? "paper" : "night");
    } catch {}
  </script>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=20260728-orbit1">
  <link rel="stylesheet" href="/assets/css/portfolio.css?v=20260729-local-attractions1">
  <script src="/assets/js/portfolio.js?v=20260729-local-attractions1" defer></script>
</head>
<body class="errorBody">
  <canvas class="ambientCanvas" id="ambient-canvas" aria-hidden="true"></canvas>
  <div class="noiseLayer" aria-hidden="true"></div>
  <main class="errorPage">
    <header class="errorTopbar">
      <a class="brand" href="/" aria-label="返回首页">陈·未完稿</a>
      <button class="themeToggle" type="button" aria-pressed="false" aria-label="切换主题">
        <span class="toggleDot"></span><span class="themeText">明亮</span>
      </button>
    </header>
    <section class="errorPanel" aria-labelledby="error-title">
      <span class="errorCode" aria-hidden="true">404</span>
      <div class="errorCopy">
        <span class="eyebrow">LOST IN ORBIT / 404</span>
        <h1 id="error-title">这颗页面，<br>暂时不在轨道上。</h1>
        <p>也许地址写错了，或这份未完稿正在重新编辑。回到首页，继续看那些已经被做出来的想法。</p>
        <a class="cta" href="/">返回作品集 <span aria-hidden="true">↗</span></a>
      </div>
      <div class="errorOrbit" aria-hidden="true">
        <span class="errorSun"></span>
        <span class="errorRing"><i></i></span>
      </div>
    </section>
    <footer><span>© 2026 陈·未完稿</span><span>走丢，也是一种探索。</span></footer>
  </main>
</body>
</html>
